name: Android APK Olustur (Flet)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Repo Kodlarini Cek
        uses: actions/checkout@v4

      - name: Linux Paketlerini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils zip unzip clang cmake ninja-build pkg-config libncurses5 libglu1-mesa

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Java JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter SDK Kur (Flet 0.24 Uyumlu)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'
          cache: true

      - name: Android Lisanslarini Onayla
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name "sdkmanager" | head -n 1)
          python3 -c 'print("y\n" * 40)' | "$SDKMANAGER" --licenses || true
          python3 -c 'print("y\n" * 40)' | flutter doctor --android-licenses || true

      - name: Python Paketlerini ve Mobil Shim Enjeksiyonunu Calistir
        run: |
          rm -f pyproject.toml
          printf "requests\n" > requirements.txt
          python -m pip install --upgrade pip
          pip install "flet[all]==0.24.1" requests

      - name: Flet Build APK Komutunu Calistir (Android Hedefli)
        run: |
          flet build apk --include-packages requests --project "Alfa Trade Bot" --org "com.alfatrade" -vv --no-rich-output

      - name: Olusan APK Dosyasini Yukle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Alfa-Trade-Bot-Android-APK
          path: build/apk/*.apk
