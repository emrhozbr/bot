- name: Flet Build APK Komutunu Calistir
        run: |
          # 1. Flet 0.24.1 build sablonunu indir ve Android SDK / Paket uyumsuzluklarini sabitle
          git clone --depth 1 --branch 0.24.1 https://github.com/flet-dev/flet-build-template.git /tmp/flet-template
          
          python3 -c '
          # pubspec.yaml icine uyumlu surum kilitlerini (dependency_overrides) ekle
          p_path = "/tmp/flet-template/{{cookiecutter.out_dir}}/pubspec.yaml"
          with open(p_path, "r") as f: c = f.read()
          overrides = """
          dependency_overrides:
            package_info_plus: 8.0.0
            shared_preferences: 2.2.3
            shared_preferences_android: 2.2.2
            file_picker: 8.0.6
            url_launcher: 6.2.6
            url_launcher_android: 6.3.1
            wakelock_plus: 1.2.5
            sensors_plus: 5.0.1
            flutter_plugin_android_lifecycle: 2.0.19
            path_provider_android: 2.2.4
          """
          with open(p_path, "w") as f: f.write(c + "\n" + overrides)
          '

          # 2. Sabitlenmis yerel sablon ile APK derle
          flet build apk \
            --project "Alfa Trade Bot" \
            --org "com.alfatrade" \
            --template-dir "/tmp/flet-template" \
            -vv --no-rich-output
