name: Android APK Olustur (Flet)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Repo Kodlarini Cek
        uses: actions/checkout@v4

      - name: Sistem Paketlerini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils zip unzip clang cmake ninja-build pkg-config libncurses5 libglu1-mesa

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Java JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter SDK Kur (Flet 0.24 Uyumlu)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'
          cache: true

      - name: Android Lisanslarini Onayla
        run: |
          mkdir -p /home/runner/android/sdk/licenses
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > /home/runner/android/sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb139a648b0" >> /home/runner/android/sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fb8" >> /home/runner/android/sdk/licenses/android-sdk-license
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name "sdkmanager" | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          fi
          yes | flutter doctor --android-licenses || true

      - name: main.py ve requirements.txt Dosyalarini APK Icin Hazirla
        run: |
          rm -f pyproject.toml
          printf "flet==0.24.1\nrequests\ncertifi\nurllib3\nidna\ncharset-normalizer\n" > requirements.txt

          cat << 'EOF' > patch_main.py
          import re

          with open("main.py", "r", encoding="utf-8") as f:
              c = f.read()

          # 1. Masaustu kütüphaneleri kalmissa temizle
          c = c.replace("import pandas as pd\n", "").replace("import numpy as np\n", "")

          # 2. ANDROID_VERI_DIZINI'ni Android'de yazilabilir (writable) klasore yonlendir
          android_dir_patch = """
          import tempfile
          ANDROID_VERI_DIZINI = os.environ.get("FLET_APP_STORAGE_DATA") or os.environ.get("HOME") or tempfile.gettempdir()
          try:
              os.makedirs(ANDROID_VERI_DIZINI, exist_ok=True)
          except Exception:
              ANDROID_VERI_DIZINI = tempfile.gettempdir()
          bd = os.path.join(ANDROID_VERI_DIZINI, "binance_api_config.json")
          ap = os.path.join(ANDROID_VERI_DIZINI, "islem_gecmisi.json")
          aN = os.path.join(ANDROID_VERI_DIZINI, "acik_islemler.json")
          ah = []
          """

          # ANDROID_VERI_DIZINI tanimini bul ve hemen altina yazilabilir dizin + bd, ap, aN ekle
          if "ANDROID_VERI_DIZINI" in c:
              c = re.sub(
                  r'ANDROID_VERI_DIZINI\s*=\s*[^\n]+',
                  android_dir_patch.strip(),
                  c,
                  count=1
              )
          else:
              c = c.replace("import flet as ft", "import flet as ft\n" + android_dir_patch.strip(), 1)

          # 3. _f fonksiyonu oncesinde bd hala yoksa garanti olarak ekle
          if "bd = os.path.join" not in c:
              c = c.replace("def _f(d,c,i=-2):", android_dir_patch.strip() + "\ndef _f(d,c,i=-2):")

          # 4. _api_yukle() cagrilmadan once borsa_kur() fonksiyonunun calistigindan emin ol
          if "def _api_yukle():" in c:
              ust_kisim = c.split("def _api_yukle():")[0]
              if "borsa_kur(PIYASA_MODU, TESTNET_AKTIF)" not in ust_kisim:
                  c = c.replace("def _api_yukle():", "borsa_kur(PIYASA_MODU, TESTNET_AKTIF)\ndef _api_yukle():", 1)

          # 5. Uygulamanin sessizce kapanmasini onleyen Global Hata Yakalayici (Crash Catcher) ekle
          crash_guard_bas = """
          import traceback as _tb
          try:
          """
          crash_guard_son = """
          except Exception as _uygulama_hatasi:
              _hata_metni = _tb.format_exc()
              import flet as _ft
              def _hata_ekrani(page: _ft.Page):
                  page.bgcolor = "#1A1A1A"
                  page.scroll = "auto"
                  page.add(
                      _ft.Container(
                          padding=20,
                          content=_ft.Column([
                              _ft.Text("UYGULAMA BAŞLATMA HATASI", color="red", size=20, weight="bold"),
                              _ft.Text("Lütfen bu ekranın görüntüsünü paylaşın:", color="white", size=14),
                              _ft.Container(
                                  bgcolor="#000000",
                                  padding=12,
                                  border_radius=8,
                                  content=_ft.Text(_hata_metni, color="#FF6B6B", size=11, selectable=True, font_family="monospace")
                              )
                          ])
                      )
                  )
              _ft.app(target=_hata_ekrani)
          """

          satirlar = c.splitlines()
          girintili_kod = "\n".join("    " + s if s.strip() else "" for s in satirlar)
          tam_kod = crash_guard_bas.strip() + "\n" + girintili_kod + "\n" + crash_guard_son.strip() + "\n"

          with open("main.py", "w", encoding="utf-8") as f:
              f.write(tam_kod)
          EOF

          python3 patch_main.py
          rm -f patch_main.py
          python3 -m py_compile main.py

      - name: Python Paketlerini Yukle
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.24.1" requests

      - name: Flet 0.24.1 Flutter Sablonunu Hazirla ve Paket Surumlerini Sabitle
        run: |
          rm -rf /tmp/flet-template
          git clone --depth 1 --branch 0.24.1 https://github.com/flet-dev/flet-build-template.git /tmp/flet-template
          cat << 'EOF' >> "/tmp/flet-template/{{cookiecutter.out_dir}}/pubspec.yaml"

          dependency_overrides:
            image: 4.3.0
            archive: 3.6.1
            flutter_native_splash: 2.4.4
            flutter_launcher_icons: 0.13.1
            package_info_plus: 8.0.2
            package_info_plus_platform_interface: 3.0.1
            shared_preferences: 2.2.3
            shared_preferences_android: 2.2.2
            file_picker: 8.0.6
            url_launcher: 6.2.6
            url_launcher_android: 6.3.1
            wakelock_plus: 1.2.5
            wakelock_plus_platform_interface: 1.2.1
            sensors_plus: 4.0.2
            sensors_plus_platform_interface: 1.2.0
            flutter_plugin_android_lifecycle: 2.0.19
            path_provider: 2.1.3
            path_provider_android: 2.2.4
            http: 1.2.2
            web: 0.5.1
          EOF

      - name: Build APK with Flet
        run: |
          flet build apk \
            --project "Alfa Trade Bot" \
            --org "com.alfatrade" \
            --template "/tmp/flet-template" \
            --exclude .git --exclude build --exclude __pycache__ \
            -vv --no-rich-output

          mkdir -p apk_cikti
          find . -name "*.apk" -exec cp {} apk_cikti/ \;
          ls -la apk_cikti/

      - name: Olusan APK Dosyasini Yukle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Alfa-Trade-Bot-Android-APK
          path: apk_cikti/*.apk
          if-no-files-found: error
