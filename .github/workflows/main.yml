name: Android APK Olustur (Flet)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Repo Kodlarini Cek
        uses: actions/checkout@v4

      - name: Requirements ve Config Icinden Numpy-Pandas Temizle
        run: |
          echo "flet==0.24.1" > requirements.txt
          if [ -f "pyproject.toml" ]; then
            sed -i '/numpy/d' pyproject.toml
            sed -i '/pandas/d' pyproject.toml
            sed -i '/matplotlib/d' pyproject.toml
            sed -i '/customtkinter/d' pyproject.toml
          fi

      - name: Linux Paketlerini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils zip unzip clang cmake ninja-build pkg-config libncurses5 libglu1-mesa

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Java JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter SDK Kur (Flet 0.24 Uyumlu)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'
          cache: true

      - name: Android Lisanslarini Onayla
        run: |
          mkdir -p /home/runner/android/sdk/licenses
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > /home/runner/android/sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb139a648b0" >> /home/runner/android/sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fb8" >> /home/runner/android/sdk/licenses/android-sdk-license
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name "sdkmanager" | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          fi
          yes | flutter doctor --android-licenses || true

      - name: Python Paketlerini Yukle
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.24.1" requests

      - name: Flet 0.24.1 Flutter Sablonunu Hazirla ve Paket Surumlerini Sabitle
        run: |
          rm -rf /tmp/flet-template
          git clone --depth 1 --branch 0.24.1 https://github.com/flet-dev/flet-build-template.git /tmp/flet-template
          cat << 'EOF' >> "/tmp/flet-template/{{cookiecutter.out_dir}}/pubspec.yaml"

          dependency_overrides:
            wakelock_plus: 1.2.8
            package_info_plus: 8.0.2
            file_picker: 8.0.6
            flutter_plugin_android_lifecycle: 2.0.22
            http: 1.2.2
          EOF

      - name: Build APK with Flet
        run: |
          flet build apk --project "Alfa Trade Bot" --org "com.alfatrade" --template /tmp/flet-template --exclude .git --exclude build --exclude __pycache__ -vv --no-rich-output

          mkdir -p apk_cikti
          find . -name "*.apk" -exec cp {} apk_cikti/ \;
          ls -la apk_cikti/

      - name: Olusan APK Dosyasini Yukle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Alfa-Trade-Bot-Android-APK
          path: apk_cikti/*.apk
          if-no-files-found: error
