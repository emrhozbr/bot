name: Android APK Olustur (Flet)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Repo Kodlarini Cek
        uses: actions/checkout@v4

      - name: Linux Paketlerini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils zip unzip clang cmake ninja-build pkg-config

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Java JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK Lisanslarini Her Yerde Onayla
        run: |
          for sdk_dir in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk" "$HOME/flet/android"; do
            if [ -n "$sdk_dir" ]; then
              mkdir -p "$sdk_dir/licenses"
              echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$sdk_dir/licenses/android-sdk-license"
              echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$sdk_dir/licenses/android-sdk-preview-license"
            fi
          done

      - name: Flet Yukle (Kararli Surum)
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==0.24.1" ccxt pandas numpy requests

      - name: Flutter SDK Kur (Flet 0.24 Uyumlu)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'
          cache: true

      - name: Flet Build APK Komutunu Calistir
        run: |
          flet build apk --verbose --no-rich-output

      - name: Olusan APK Dosyasini Yukle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Alfa-Trade-Bot-Android-APK
          path: build/apk/*.apk
